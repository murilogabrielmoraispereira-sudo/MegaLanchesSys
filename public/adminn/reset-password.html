<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Redefinir senha - Mega Lanches</title>
  <link rel="stylesheet" href="indexadmin.css?v=20260217h">
  <link rel="stylesheet" href="neo-admin.css?v=20260217j">
  <link rel="stylesheet" href="login.css?v=20260804-contas">
</head>
<body class="admin-login dark" data-theme-lock="dark">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">ML</div>
        <div class="brand-text">
          <span class="brand-name">Mega Lanches</span>
          <span class="brand-sub">Seguranca da conta</span>
        </div>
      </div>
      <div class="header-title">
        <h1>Redefinir senha</h1>
        <p>Crie uma nova senha para sua conta</p>
      </div>
      <div class="header-actions"></div>
    </div>
  </header>

  <main class="page">
    <div class="login-shell" style="grid-template-columns:1fr;max-width:560px;">
      <div class="login-box">
        <h2>Nova senha</h2>
        <p class="login-helper" id="reset-helper">O link e valido por tempo limitado e pode ser usado somente uma vez.</p>
        <label for="reset-password">Nova senha forte</label>
        <input type="password" id="reset-password" autocomplete="new-password" placeholder="Minimo de 12 caracteres">
        <label for="reset-confirm">Confirmar nova senha</label>
        <input type="password" id="reset-confirm" autocomplete="new-password" placeholder="Repita a nova senha">
        <small class="password-hint">Use maiuscula, minuscula, numero e caractere especial.</small>
        <button id="btn-reset-password" type="button">Redefinir senha</button>
        <button id="btn-reset-back" class="login-secondary" type="button">Voltar ao login</button>
      </div>
    </div>
  </main>

  <div id="aviso" class="aviso"></div>
  <script src="reset-password.js?v=20260804a"></script>
</body>
</html>
